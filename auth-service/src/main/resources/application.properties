eureka.client.service-url.defaultZone=http://discovery-server:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

spring.jpa.hibernate.ddl-auto=update
spring.datasource.url=jdbc:postgresql://authservicepostgres:5432/authService
spring.datasource.username=postgres
spring.datasource.password=qwerty

spring.application.security.jwt.secret-key = 68566D5971337336763979244226452948404D635166546A576E5A7234753777
spring.application.security.jwt.secret-key.expiration=60000000
spring.application.security.jwt.refresh-token.expiration= 604800000


server.port=8081

#kafka Properties
#spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.bootstrap-servers=broker:9092
spring.kafka.template.default-topic=checkJwtTopic
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

spring.kafka.consumer.group-id=jwtRequest